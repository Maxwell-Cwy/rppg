plugins {
    // 对应libs中[plugins]的android-application（版本引用agp变量）
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication'
    compileSdk {
        version = release(36) // 与你的minSdk 35、targetSdk 36兼容
    }

    signingConfigs {
        debug {
            storeFile file("C:/Users/407-34/Desktop/MyApplication/debug(1).keystore")
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // 关键：启用ViewBinding（可选，但有助于布局解析，减少渲染错误）
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 所有依赖引用与libs文件[library]部分完全一致，无拼写错误
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"

    implementation(files("libs/wzaisdk-release.aar"))

    // 导入tensorflow lite 来调用我们的模型
    implementation("org.tensorflow:tensorflow-lite:2.15.0")
    implementation("org.tensorflow:tensorflow-lite-gpu:2.15.0")
    implementation("org.tensorflow:tensorflow-lite-select-tf-ops:2.15.0")
    // 通过camera2来快捷调用设备相机
    implementation ("androidx.camera:camera-core:1.4.0-alpha04")
    implementation ("androidx.camera:camera-camera2:1.4.0-alpha04")
    implementation ("androidx.camera:camera-lifecycle:1.4.0-alpha04")
    // 通过camera-view 来进行相机画面预览展示
    implementation ("androidx.camera:camera-view:1.4.0-alpha04")
    //    okhttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.12.0"))
    // define any required OkHttp artifacts without version
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")
    //    gson
    implementation("com.google.code.gson:gson:2.10.1")
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

}
